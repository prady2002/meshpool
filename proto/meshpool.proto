// MeshPool wire contracts (proto3).
//
// These are the *shared contracts* from spec §8/§0. In the reference (production)
// stack, node<->control-plane and node<->node traffic is gRPC generated from this
// file. In this runnable build the exact same messages are expressed as Pydantic
// models in `meshpool/common/models.py` and carried over HTTP/JSON + SSE, so porting
// to gRPC is a transport swap, not a redesign. Field names/shapes are kept 1:1 with
// the Pydantic models on purpose.
//
// Streaming note: the Forward RPC below is the pipeline-parallel inference hot path
// — only hidden-state activations cross the wire, never weights/gradients.

syntax = "proto3";

package meshpool.v1;

option go_package = "github.com/meshpool/meshpool/proto/gen;meshpoolv1";

// Arbitrary JSON work-unit payloads/results are carried as Struct so the proto shape
// matches the HTTP/JSON build 1:1 (Pydantic `dict` fields).
import "google/protobuf/struct.proto";

// =========================================================================== //
// Enums
// =========================================================================== //
enum Schedule {
  SCHEDULE_ALWAYS = 0;
  SCHEDULE_IDLE_ONLY = 1;
  SCHEDULE_BUSINESS_HOURS = 2;
  SCHEDULE_OUTSIDE_BUSINESS_HOURS = 3;
}

enum TrustTier {
  TRUST_TIER_SAME_OWNER = 0;   // home: full mutual trust (MVP)
  TRUST_TIER_TRUSTED_ORG = 1;  // office: SSO-gated, reputation scoring
  TRUST_TIER_OPEN_PUBLIC = 2;  // public: out of MVP scope
}

enum NodeStatus {
  NODE_STATUS_ONLINE = 0;
  NODE_STATUS_DRAINING = 1;    // reclaim in progress; finish/evict in-flight work
  NODE_STATUS_OFFLINE = 2;
}

enum UnitStatus {
  UNIT_STATUS_PENDING = 0;
  UNIT_STATUS_ASSIGNED = 1;
  UNIT_STATUS_RUNNING = 2;
  UNIT_STATUS_DONE = 3;
  UNIT_STATUS_FAILED = 4;
}

// =========================================================================== //
// Node capability / policy / load
// =========================================================================== //
message Capability {
  int32  cpu_cores = 1;
  string cpu_arch = 2;
  int64  ram_mb = 3;
  bool   gpu = 4;
  int64  vram_mb = 5;
  int64  disk_mb = 6;
  double flops_estimate = 7;   // rough micro-benchmark score (higher = faster)
}

message LinkStats {
  double latency_ms = 1;       // measured, not guessed
  double bandwidth_mbps = 2;
}

message DonationPolicy {
  int32    cpu_pct = 1;        // donate up to this % of CPU
  int64    ram_mb = 2;
  bool     gpu_allowed = 3;
  Schedule schedule = 4;
  int32    idle_minutes = 5;
}

message NodeLoad {
  double cpu_load_pct = 1;
  int64  ram_used_mb = 2;
  int32  running_units = 3;
  double idle_seconds = 4;
}

message Node {
  string         id = 1;
  string         name = 2;
  string         url = 3;      // agent's own base URL (peers/CP dial it)
  string         owner = 4;
  Capability     capability = 5;
  LinkStats      link = 6;
  DonationPolicy policy = 7;
  NodeLoad       load = 8;
  TrustTier      trust_tier = 9;
  double         trust_score = 10;
  NodeStatus     status = 11;
  int64          last_heartbeat_ms = 12;
  int64          registered_ms = 13;
}

// =========================================================================== //
// Registration / heartbeat
// =========================================================================== //
message RegisterRequest {
  string         name = 1;
  string         url = 2;
  string         owner = 3;
  Capability     capability = 4;
  LinkStats      link = 5;
  DonationPolicy policy = 6;
  string         enroll_token = 7;   // Tier 1+ enrollment gate; ignored at Tier 0
}

message RegisterResponse {
  string node_id = 1;
  int64  control_plane_time_ms = 2;
  int32  heartbeat_interval_s = 3;
  string node_token = 4;   // per-node session token; presented (X-MeshPool-Node-Token /
                           // gRPC metadata) so the control plane verifies node identity
                           // server-side on sensitive calls (secret redemption).
}

message Heartbeat {
  string         node_id = 1;
  NodeLoad       load = 2;
  DonationPolicy policy = 3;
  NodeStatus     status = 4;
}

message Ack { bool ok = 1; }
message Empty {}

// =========================================================================== //
// Batch engine
// =========================================================================== //
message WorkUnit {
  string id = 1;
  google.protobuf.Struct payload = 2;   // arbitrary JSON object for the named func
  UnitStatus status = 3;
  string assigned_node = 4;
  int32  attempts = 5;
  google.protobuf.Struct result = 6;    // JSON object result (matches HTTP `result`)
  string error = 7;
}

message BatchJob {
  string   id = 1;
  string   name = 2;
  string   func = 3;           // named worker function ("square", "sha_pow", ...)
  repeated WorkUnit units = 4;
  int32    cpu_pct_per_unit = 5;
  int64    ram_mb_per_unit = 6;
  string   owner = 7;
  string   status = 8;
  int64    created_ms = 9;
  repeated string secret_names = 10;   // scoped secrets this job needs (values brokered)
}

// Agent-side dispatch of a single unit (HTTP: POST /run_unit). Flat, to match the
// agent's `RunUnitRequest` exactly (the runtime sandboxes + resource-caps it).
message RunUnitRequest {
  string job_id = 1;
  string unit_id = 2;
  string func = 3;
  google.protobuf.Struct payload = 4;
  int32  cpu_pct = 5;
  int64  ram_mb = 6;
  // name -> single-use, node-scoped lease id; the agent redeems each for its value
  // just-in-time (RedeemSecret) so credentials never travel in the job/unit spec.
  map<string, string> secret_leases = 7;
}

message UnitResult {
  string job_id = 1;
  string unit_id = 2;
  UnitStatus status = 3;
  string result_json = 4;
  string error = 5;
}

// =========================================================================== //
// Hosting engine
// =========================================================================== //
message Replica {
  string id = 1;
  string node_id = 2;
  string node_name = 3;
  string url = 4;              // where the running replica is reachable
  bool   healthy = 5;
  int64  started_ms = 6;
}

message Deployment {
  string   id = 1;
  string   name = 2;
  string   app = 3;            // named built-in app or command spec
  int32    replicas_desired = 4;
  repeated Replica replicas = 5;
  string   owner = 6;
  string   status = 7;
  int64    created_ms = 8;
}

// =========================================================================== //
// Inference engine (flagship — pipeline-parallel sharding)
// =========================================================================== //
message LayerAssignment {
  string node_id = 1;
  string url = 2;
  int32  start_layer = 3;      // inclusive
  int32  end_layer = 4;        // exclusive
  bool   is_first = 5;         // owns token embedding + input
  bool   is_last = 6;          // owns final norm + LM head
}

message ModelDeployment {
  string   id = 1;
  string   model = 2;
  int32    n_layers = 3;
  repeated LayerAssignment partition = 4;
  string   owner = 5;
  string   status = 6;
  double   tokens_per_sec = 7;
  int64    created_ms = 8;
}

// Load a contiguous block of layers onto a node (HTTP: POST /shard/load).
message ShardLoadRequest {
  string model_id = 1;         // deployment id this shard belongs to
  string model_name = 2;       // checkpoint name (e.g. "nano-gpt")
  int32  start_layer = 3;
  int32  end_layer = 4;
  bool   is_first = 5;
  bool   is_last = 6;
}

// Unload a shard (HTTP: POST /shard/unload).
message ShardUnloadRequest { string model_id = 1; }

// Unary forward hop in the HTTP build (POST /shard/forward). `is_tokens` marks the
// first hop (token ids); later hops carry hidden-state activations. Production uses
// the bidi-streaming Forward(stream ActivationChunk) to keep the pipeline full.
message ShardForwardRequest {
  string model_id = 1;
  repeated double data = 2;    // token ids (is_tokens) or a flat [T, d_model] tensor
  bool   is_tokens = 3;
}

// The pipeline hot path. `is_tokens` marks the first hop (token ids); every
// subsequent hop carries hidden-state activations. Shapes: [seq_len, d_model]
// for hidden states, or [seq_len, vocab] logits out of the last stage.
message ActivationChunk {
  string model_id = 1;
  bool   is_tokens = 2;
  repeated int32  tokens = 3;        // set iff is_tokens
  int32  seq_len = 4;
  int32  width = 5;                  // d_model (hidden) or vocab (last stage)
  repeated float  data = 6;          // row-major [seq_len, width]
}

message InferenceRequest {
  string deployment_id = 1;
  string prompt = 2;
  int32  max_new_tokens = 3;
  double temperature = 4;
}

message InferenceReply {
  string text = 1;
  int32  tokens_generated = 2;
  double tokens_per_sec = 3;
  repeated string stages = 4;        // node names in pipeline order (for the UI)
}

// =========================================================================== //
// Trust + contribution ledger (Tier 0 active; Tier 1/2 fields inert)
// =========================================================================== //
message LedgerEntry {
  string id = 1;
  string node_id = 2;
  string owner = 3;
  string kind = 4;             // "donated" | "consumed"
  double compute_units = 5;    // cpu_pct-share * seconds
  int64  ts_ms = 6;
  string detail = 7;
}

message TrustScore {
  string node_id = 1;
  double benchmark_pass_rate_ema = 2;
  double task_success_rate_ema = 3;
  double uptime_ratio_ema = 4;
  double latency_consistency_ema = 5;
}

// =========================================================================== //
// Scoped secret brokering (spec §5). Values live only in the control plane;
// workers receive single-use, node-scoped, TTL-bounded leases they redeem
// just-in-time. See docs/security.md and meshpool/common/secrets.py.
// =========================================================================== //
message PutSecretRequest {
  string name = 1;
  string value = 2;            // never returned by any RPC after this
  string owner = 3;
}

message SecretNames {
  repeated string names = 1;   // names only — values are never listed
  int32 active_leases = 2;
}

message RedeemRequest {
  string lease_id = 1;
  string node_id = 2;          // advisory; the control plane derives the authoritative
                               // node identity from the session token when presented
}

message SecretValue {
  string value = 1;            // returned exactly once for a valid, unused lease
}

// =========================================================================== //
// Services
// =========================================================================== //

// Node <-> Control Plane.
service ControlPlane {
  rpc Register  (RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat (Heartbeat)       returns (Ack);   // HTTP returns {"ok": true}
  rpc ReportUnitResult (UnitResult) returns (Ack);

  // Secret vault (owner) + just-in-time lease redemption (worker).
  rpc PutSecret    (PutSecretRequest) returns (Ack);
  rpc ListSecrets  (Empty)            returns (SecretNames);
  rpc RedeemSecret (RedeemRequest)    returns (SecretValue);
}

// Control Plane -> Agent (work + lifecycle). In the HTTP build these are the
// agent's `/shard/*`, batch-dispatch and `/reclaim` endpoints.
service Agent {
  rpc RunUnit     (RunUnitRequest)     returns (UnitResult);   // HTTP: POST /run_unit
  rpc LoadShard   (ShardLoadRequest)   returns (Ack);          // HTTP: POST /shard/load
  rpc UnloadShard (ShardUnloadRequest) returns (Ack);          // HTTP: POST /shard/unload

  // Pipeline-parallel forward pass. HTTP build: unary POST /shard/forward
  // (ShardForwardRequest -> ActivationChunk). Production: bidi streaming keeps the
  // pipeline full (micro-batching hides bubbles).
  rpc Forward (stream ActivationChunk) returns (stream ActivationChunk);

  // Instant local kill-switch: drain + reclaim now, no approval needed.
  rpc Reclaim (Ack) returns (Ack);                             // HTTP: POST /reclaim
}
